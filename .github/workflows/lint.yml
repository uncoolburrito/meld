name: Lint & Format

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, meld-main]
    paths:
      - "**.swift"
      - ".swiftlint.yml"
      - ".swiftformat"
      - ".github/workflows/lint.yml"
  pull_request:
    branches: [main, meld-main]
    paths:
      - "**.swift"
      - ".swiftlint.yml"
      - ".swiftformat"
      - ".github/workflows/lint.yml"

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install SwiftLint
        run: |
          set -euo pipefail
          SWIFTLINT_VERSION="0.65.1"
          curl -sSL "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip" -o swiftlint.zip
          sudo unzip -q -o swiftlint.zip -d /usr/local/bin
          if [ -f /usr/local/bin/swiftlint-static ]; then sudo ln -sf /usr/local/bin/swiftlint-static /usr/local/bin/swiftlint; fi
          rm swiftlint.zip
          swiftlint --version

      - name: Run SwiftLint
        run: |
          swiftlint lint --strict --reporter github-actions-logging

  swiftformat:
    name: SwiftFormat
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Cache Homebrew
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/Homebrew
            ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-homebrew-swiftformat

      - name: Install SwiftFormat
        run: |
          brew install swiftformat

      - name: Check formatting
        run: |
          swiftformat --lint . 2>&1 || {
            echo "::error::Code is not formatted. Run 'swiftformat .' locally and commit the changes."
            exit 1
          }
