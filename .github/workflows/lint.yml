name: Lint & Format

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, meld-main]
    paths:
      - "**.swift"
      - ".swiftlint.yml"
      - ".swiftformat"
      - ".github/workflows/lint.yml"
  pull_request:
    branches: [main, meld-main]
    paths:
      - "**.swift"
      - ".swiftlint.yml"
      - ".swiftformat"
      - ".github/workflows/lint.yml"

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install SwiftLint
        run: |
          set -euo pipefail
          SWIFTLINT_VERSION="0.65.1"
          curl -sSL "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip" -o swiftlint.zip
          sudo unzip -q -o swiftlint.zip -d /usr/local/bin
          if [ -f /usr/local/bin/swiftlint-static ]; then sudo ln -sf /usr/local/bin/swiftlint-static /usr/local/bin/swiftlint; fi
          rm swiftlint.zip
          swiftlint --version

      - name: Run SwiftLint
        run: |
          swiftlint lint --strict --reporter github-actions-logging

  swiftformat:
    name: SwiftFormat
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install SwiftFormat
        run: |
          set -euo pipefail
          SWIFTFORMAT_VERSION="0.55.5"
          curl -sSL "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip" -o swiftformat.zip
          sudo unzip -q -o swiftformat.zip -d /tmp
          sudo mv /tmp/swiftformat_linux /usr/local/bin/swiftformat
          sudo chmod +x /usr/local/bin/swiftformat
          rm swiftformat.zip
          swiftformat --version

      - name: Check formatting
        run: |
          swiftformat --lint Sources Tests 2>&1 || {
            echo "::error::Code is not formatted. Run 'swiftformat .' locally and commit the changes."
            exit 1
          }
